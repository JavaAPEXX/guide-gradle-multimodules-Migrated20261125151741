apply plugin: 'war'

description = 'WAR Module'

repositories {
    mavenCentral()
}

configurations {
    warOnly
}

artifacts {
    warOnly war
}

dependencies {
    // tag::projectJar[]
    implementation project(':jar')
    // end::projectJar[]
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    compileOnly 'org.eclipse.microprofile:microprofile:7.1'
    
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile) {
    options.release.set(21)
}

war {
    archiveFileName = rootProject.name + '-' + getArchiveBaseName().get() + '-' +
                      rootProject.version + '.' + getArchiveExtension().get()
}

// tag::dependsOn[]
war.dependsOn ':jar:jar'
// end::dependsOn[]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}